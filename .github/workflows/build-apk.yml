name: Build Padh-Ai Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Recreate Android files
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Get packages again
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Padh-Ai-Android
          path: build/app/outputs/flutter-apk/app-release.apk
