name: Build Padh-Ai Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Repair Android Setup & Add Internet Permission
      run: |
        rm -rf android
        flutter create . --project-name padh_ai --platforms android --org com.padhai
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

    - name: Set minSdk Version
      run: |
        sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
        sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: padh-ai-app
        path: build/app/outputs/flutter-apk/app-release.apk
