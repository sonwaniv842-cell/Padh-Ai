<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>चित्र वर्णमाला - Hindi Learning App</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f1fb;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Styles */
        header {
            width: 100%;
            padding: 20px;
            background-color: white;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            font-size: 24px;
            margin-right: 20px;
            cursor: pointer;
            color: #333;
        }

        h1 {
            font-size: 22px;
            margin: 0;
            color: #333;
            font-weight: 500;
        }

        /* Grid Container */
        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Card Styles (Matching your image) */
        .card {
            background-color: white;
            border-radius: 25px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.95);
        }

        .emoji-img {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .letter {
            font-size: 42px;
            font-weight: bold;
            color: #2196F3; /* Blue color from your image */
            margin-bottom: 5px;
        }

        .word {
            font-size: 18px;
            color: #888; /* Grey color from your image */
            font-weight: 500;
        }

        /* Footer space */
        .footer-spacer {
            height: 50px;
        }
    </style>
</head>
<body>

    <header>
        <div class="back-btn">←</div>
        <h1>चित्र वर्णमाला</h1>
    </header>

    <div class="alphabet-grid" id="alphabetGrid">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <div class="footer-spacer"></div>

    <script>
        // FULL DATASET: Vowels + Consonants
        const varnamalaData = [
            { letter: "अ", word: "अनार", icon: "🍎" },
            { letter: "आ", word: "आम", icon: "🥭" },
            { letter: "इ", word: "इमली", icon: "🌿" },
            { letter: "ई", word: "ईख", icon: "🎋" },
            { letter: "उ", word: "उल्लू", icon: "🦉" },
            { letter: "ऊ", word: "ऊन", icon: "🧶" },
            { letter: "ऋ", word: "ऋषि", icon: "🧘" },
            { letter: "ए", word: "एड़ी", icon: "🦶" },
            { letter: "ऐ", word: "ऐनक", icon: "👓" },
            { letter: "ओ", word: "ओखली", icon: "🥣" },
            { letter: "औ", word: "औरत", icon: "👩" },
            { letter: "अं", word: "अंगूर", icon: "🍇" },
            { letter: "क", word: "कबूतर", icon: "🐦" },
            { letter: "ख", word: "खरगोश", icon: "🐇" },
            { letter: "ग", word: "गमला", icon: "🪴" },
            { letter: "घ", word: "घड़ी", icon: "⌚" },
            { letter: "च", word: "चम्मच", icon: "🥄" },
            { letter: "छ", word: "छाता", icon: "☂️" },
            { letter: "ज", word: "जहाज", icon: "🚢" },
            { letter: "झ", word: "झंडा", icon: "🚩" },
            { letter: "ट", word: "टमाटर", icon: "🍅" },
            { letter: "ठ", word: "ठठेरा", icon: "🛠️" },
            { letter: "ड", word: "डमरू", icon: "🥁" },
            { letter: "ढ", word: "ढक्कन", icon: "🥘" },
            { letter: "त", word: "तरबूज", icon: "🍉" },
            { letter: "थ", word: "थर्मस", icon: "🍼" },
            { letter: "द", word: "दवात", icon: "🖋️" },
            { letter: "ध", word: "धनुष", icon: "🏹" },
            { letter: "न", word: "नल", icon: "🚰" },
            { letter: "प", word: "पतंग", icon: "🪁" },
            { letter: "फ", word: "फल", icon: "🍎" },
            { letter: "ब", word: "बत्तख", icon: "🦆" },
            { letter: "भ", word: "भालू", icon: "🐻" },
            { letter: "म", word: "मछली", icon: "🐟" },
            { letter: "य", word: "यज्ञ", icon: "🔥" },
            { letter: "र", word: "रथ", icon: "🏹" },
            { letter: "ल", word: "लट्टू", icon: "🔝" },
            { letter: "व", word: "वक", icon: "🦢" },
            { letter: "श", word: "शलगम", icon: "🧅" },
            { letter: "ष", word: "षट्कोण", icon: "⬢" },
            { letter: "स", word: "सपेरा", icon: "🐍" },
            { letter: "ह", word: "हाथी", icon: "🐘" },
            { letter: "क्ष", word: "क्षत्रिय", icon: "⚔️" },
            { letter: "त्र", word: "त्रिशूल", icon: "🔱" },
            { letter: "ज्ञ", word: "ज्ञानी", icon: "👨‍🏫" }
        ];

        const grid = document.getElementById('alphabetGrid');

        // Function to create and add cards to the grid
        function loadAlphabet() {
            varnamalaData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="emoji-img">${item.icon}</div>
                    <div class="letter">${item.letter}</div>
                    <div class="word">${item.word}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Initialize the app
        loadAlphabet();
    </script>
</body>
</html>
