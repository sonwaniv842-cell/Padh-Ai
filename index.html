<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padh-Ai | डिजिटल पाठशाला</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Hind:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0D0F1A; --cyan: #00E5FF; --card: rgba(255,255,255,0.07); }
        body { background: var(--bg); color: #fff; font-family: 'Hind', sans-serif; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        .robot { width: 140px; animation: float 3s infinite ease-in-out; margin-top: 30px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 3.5rem; color: var(--cyan); text-shadow: 0 0 15px var(--cyan); margin: 10px 0; }
        
        .btn-dl { 
            background: linear-gradient(135deg, var(--cyan), #00B0FF); 
            color: #000; padding: 18px 40px; border-radius: 50px; 
            border: none; font-weight: 800; font-size: 1.3rem; 
            cursor: pointer; box-shadow: 0 0 25px var(--cyan); 
            margin: 25px 0; display: inline-block; text-decoration: none;
        }
        .btn-dl:active { transform: scale(0.95); }

        .auth-box { background: var(--card); border: 1px solid var(--cyan); border-radius: 30px; max-width: 380px; margin: 20px auto; padding: 30px; backdrop-filter: blur(10px); }
        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--cyan); color: #fff; border-radius: 12px; box-sizing: border-box; }
        .btn-auth { background: var(--cyan); width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.1rem; }
        
        .footer { margin-top: 50px; opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/sonwaniv842-cell/Padh-Ai/main/Padh-Ai.png" class="robot">
    <h1>Padh-Ai</h1>
    <p style="font-size: 1.2rem;">नमस्ते बच्चों! चलो मिलकर पढ़ाई को मज़ेदार बनाते हैं 🤖</p>

    <!-- AUTOMATIC LATEST APK DOWNLOAD LINK -->
    <a href="https://github.com/sonwaniv842-cell/Padh-Ai/releases/latest/download/app-release.apk" class="btn-dl">
        ⬇️ मुफ़्त डाउनलोड करें
    </a>

    <div class="auth-box">
        <h3>छात्र लॉगिन</h3>
        <input type="email" placeholder="ईमेल आईडी">
        <input type="password" placeholder="6-अंकों का पिन">
        <button class="btn-auth">प्रवेश करें</button>
        <p style="margin-top: 15px; color: var(--cyan); cursor: pointer;">नया रजिस्ट्रेशन ऐप के अंदर करें</p>
    </div>

    <div class="footer">© 2026 Padh-Ai Assistant | भारत का अपना सुरक्षित ऐप 🇮🇳</div>
</body>
</html>
