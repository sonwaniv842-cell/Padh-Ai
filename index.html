<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padh-Ai | आपका प्रीमियम एआई टीचर</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00E5FF;
            --navy: #0A0E21;
            --card: rgba(29, 27, 46, 0.9);
        }
        body {
            background-color: var(--navy);
            color: white;
            font-family: 'Hind', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        .robot-logo {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        header {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1D1B2E 0%, #0A0E21 100%);
            box-sizing: border-box;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan);
            margin: 10px 0;
        }
        .btn-download {
            background: linear-gradient(90deg, var(--cyan), #00B0FF);
            color: var(--navy);
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            transition: 0.3s;
            display: inline-block;
            cursor: pointer;
        }
        .btn-download:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--cyan);
        }
        .login-card {
            background: var(--card);
            padding: 30px 25px;
            border-radius: 25px;
            border: 1px solid var(--cyan);
            max-width: 340px;
            width: 90%;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,229,255,0.15);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--cyan);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }
        input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.5;
            background: #0A0E21;
        }
    </style>
</head>
<body>

    <header>
        <div class="robot-logo">🤖</div>
        <h1>Padh-Ai</h1>
        <p>भारत का अपना स्मार्ट एआई टीचर</p>
        <br>
        
        <!-- 100% वर्क करने वाला सेफ़ लिंक -->
        <a href="https://github.com/sonwaniv842-cell/Padh-Ai/releases" 
           target="_blank" 
           class="btn-download">
           ⬇️ ऐप डाउनलोड करें
        </a>

        <div class="login-card">
            <h3 style="margin-top:0; color:var(--cyan)">स्टूडेंट पोर्टल</h3>
            <input type="email" placeholder="ईमेल आईडी">
            <input type="password" placeholder="पिन / पासवर्ड">
            
            <button style="background:var(--cyan); color:var(--navy); border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:5px;">प्रवेश करें (Login)</button>
            
            <button style="background:transparent; color:var(--cyan); border:1px solid var(--cyan); width:100%; padding:10px; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:10px;">नया स्टूडेंट रजिस्टर करें</button>
            
            <p style="font-size:0.8rem; margin-top:12px; cursor:pointer; color:var(--cyan); text-decoration:underline;">पासवर्ड भूल गए? रीसेट करें</p>
        </div>
    </header>

    <div class="footer">
        Padh-Ai Robotics Education System • Made in India
    </div>

</body>
</html>
