<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padh-Ai | आपका अपना डिजिटल गुरु</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00E5FF; --navy: #0A0E21; --card: rgba(29, 27, 46, 0.95); }
        body { background: var(--navy); color: #fff; font-family: 'Hind', sans-serif; text-align: center; margin: 0; }
        .robot-logo { width: 140px; margin-top: 40px; animation: float 3s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3rem; color: var(--cyan); margin: 10px; }
        .btn-dl { background: var(--cyan); color: #000; padding: 15px 40px; border-radius: 50px; border: none; font-weight: 800; font-size: 1.2rem; cursor: pointer; box-shadow: 0 0 20px var(--cyan); margin: 20px 0; }
        .auth-box { background: var(--card); border: 1px solid var(--cyan); border-radius: 25px; width: 90%; max-width: 380px; margin: 20px auto; padding: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid var(--cyan); color: #fff; border-radius: 10px; box-sizing: border-box; }
        .btn-auth { background: var(--cyan); width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/sonwaniv842-cell/Padh-Ai/main/Padh-Ai.png" class="robot-logo">
    <h1>Padh-Ai</h1>
    <p>नमस्ते! चलो साथ मिलकर पढ़ते हैं 🤖</p>
    <button onclick="startDL()" class="btn-dl">⬇️ ऐप डाउनलोड करें</button>
    <div class="auth-box">
        <h3>स्टूडेंट लॉगिन</h3>
        <input type="email" placeholder="ईमेल आईडी">
        <input type="password" placeholder="पिन">
        <button class="btn-auth">प्रवेश करें</button>
    </div>
    <script>
        function startDL() {
            window.location.href = "https://github.com/sonwaniv842-cell/Padh-Ai/releases";
        }
    </script>
</body>
</html>
