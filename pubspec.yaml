name: padh_ai
description: Padh AI - Future Digital School
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0      # डेटाबेस और लॉगिन के लिए
  flutter_tts: ^3.8.5           # आवाज़ (Voice) के लिए
  url_launcher: ^6.2.0          # कॉल और व्हाट्सएप के लिए
  image_picker: ^1.0.4          # कैमरा स्कैन के लिए
  webview_flutter: ^4.7.0       # HTML वर्णमाला व पहाड़ा लोड करने के लिए

flutter:
  uses-material-design: true
  assets:
    - assets/varnamala.html
    
